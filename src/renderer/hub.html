<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: blob:; media-src app: data: blob:; style-src 'self' 'unsafe-inline' app:; script-src 'self' app:">
<title>Cube Hub</title>
<link rel="stylesheet" href="app://local/node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="team.css">
<script src="app://local/node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="app://local/node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-top drag">
      <span class="app-title">Cube Hub</span>
      <button class="icon-btn no-drag" id="newBtn" title="Nouveau cube (Ctrl+N)">
        <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>
      </button>
    </div>
    <div class="list" id="list"></div>
    <div class="sidebar-bottom">
      <button class="text-btn" id="addTheme"><svg viewBox="0 0 20 20"><path d="M10 5v10M5 10h10"/></svg>Thème</button>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar drag">
      <div class="toolbar-spacer"></div>
      <button class="pill no-drag" id="widgetBtn" title="Afficher ou masquer le widget (Ctrl+Alt+W)">
        <svg viewBox="0 0 20 20"><rect x="3.5" y="6.5" width="13" height="10" rx="2.5"/><path d="M5.5 4h9"/></svg>
        <span>Widget</span>
      </button>
      <div class="pill-group no-drag">
        <button class="icon-btn" id="volumeBtn" title="Volume des sons">
          <svg viewBox="0 0 20 20" id="volumeIcon"></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Réglages">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
        </button>
      </div>
      <div class="caption-space"></div>
    </div>

    <div class="header" id="header"></div>
    <div class="tabs" id="tabs" hidden></div>
    <div class="content" id="content">
      <div class="terms" id="terms"></div>
      <div class="placeholder" id="placeholder"></div>
      <div class="team-panel" id="teamPanel" hidden></div>
    </div>
  </main>

  <div class="popover" id="volumePopover" hidden>
    <div class="pop-title">Volume général</div>
    <input type="range" min="0" max="1" step="0.01" id="masterVolume">
  </div>

  <div class="modal-back" id="modal" hidden>
    <div class="modal">
      <nav class="modal-nav" id="settingsNav"></nav>
      <section class="modal-page" id="settingsPage"></section>
      <button class="modal-close icon-btn" id="closeSettings" title="Fermer"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>
  </div>

  <div class="modal-back" id="ask" hidden>
    <div class="ask">
      <div class="ask-title" id="askTitle"></div>
      <input type="text" id="askInput" spellcheck="false">
      <div class="ask-buttons">
        <button class="btn" id="askCancel">Annuler</button>
        <button class="btn primary" id="askOk">OK</button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="wizard" hidden>
    <div class="wizard" id="wizardBody"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="hub.js"></script>
</body>
</html>
